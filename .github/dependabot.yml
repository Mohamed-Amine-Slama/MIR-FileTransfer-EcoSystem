# Mises à jour de version Dependabot.
#
# L'ancien contenu était le squelette généré par GitHub, avec
# `package-ecosystem: ""` — une valeur invalide, donc AUCUNE mise à jour de
# version n'a jamais tourné. Les alertes visibles dans l'onglet Security sont
# des *security updates*, que Dependabot produit sans configuration ; c'est
# pour cela que le dépôt recevait des alertes mais jamais de PR de montée de
# version préventive.
version: 2
updates:
  # --- npm / pnpm workspace ---------------------------------------------------
  # Un seul bloc à la racine : le lockfile pnpm couvre apps/* et packages/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Groupé, sinon 25 alertes ouvertes deviennent 25 PR à relire une par une.
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      next-web:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      cornerstone:
        patterns:
          - "@cornerstonejs/*"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "eslint*"
          - "@typescript-eslint/*"
          - "vitest"
          - "@vitest/*"
          - "tsx"
          - "@swc/*"
        update-types:
          - "minor"
          - "patch"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # sharp est lié à libvips natif : la montée se fait volontairement à la
      # main, une régression de décodage d'image casse la génération de
      # vignettes DICOM sans que rien d'autre n'échoue.
      - dependency-name: "sharp"
        update-types: ["version-update:semver-major"]

      # Majeures exclues pour les paquets qui portent une garantie du système.
      #
      # Le 2026-08-29, zod 3->4, vitest 3->4, dotenv 16->17 et Cornerstone 3->5
      # ont été fusionnées le même après-midi ; l'arbre ne compilait plus
      # (132 erreurs de typage) et la CI de la branche était rouge. zod 4 a
      # changé la sémantique de `.default()` sur un schéma de configuration qui
      # porte les durées de rétention et la durée de vie des URLs signées ;
      # Cornerstone 5 a introduit une dépendance transitive avec un avis HIGH
      # (adm-zip GHSA-xcpc-8h2w-3j85).
      #
      # Ces montées doivent être faites délibérément, avec la suite complète et
      # `pnpm verify:gates` relus, pas fusionnées automatiquement. Les mineures
      # et correctifs continuent d'arriver normalement.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@cornerstonejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pg"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions ---------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"

  # --- images de base des conteneurs applicatifs ------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Majeures de Node exclues, pour la même raison que le bloc npm ci-dessus :
      # l'image de base porte une garantie du système.
      #
      # Le 2026-08-31, « bump node from 22-alpine to 26-alpine » a cassé la
      # construction des deux images. Corepack a été retiré de la distribution
      # Node à partir de la 25, donc `corepack enable` sort en 127 (commande
      # introuvable) dès le premier RUN. Le bloc npm protège zod, Cornerstone,
      # vitest, next, NestJS et pg ; ce bloc-ci ne protégeait rien, et Node 26
      # est de surcroît hors de la plage `engines` (">=20.0.0 <25") que le dépôt
      # déclare supporter.
      #
      # Une montée de Node majeure implique de décider comment pnpm s'installe
      # sans corepack ET d'élargir `engines` délibérément. Les mineures et les
      # correctifs de sécurité continuent d'arriver normalement.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # --- Terraform --------------------------------------------------------------
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/environments/dev"
      - "/infra/terraform/environments/staging"
      - "/infra/terraform/environments/prod"
      - "/infra/terraform/modules/database"
      - "/infra/terraform/modules/network"
    schedule:
      interval: "weekly"
      day: "monday"
